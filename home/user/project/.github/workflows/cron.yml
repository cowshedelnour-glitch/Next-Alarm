name: Ping Cron Endpoint

on:
  schedule:
    - cron: '*/10 * * * *' # كل 10 دقائق (يمكنك تعديلها)
  workflow_dispatch: # يتيح لك تشغيله يدوياً

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API
        run: |
          if [ -z "${{ secrets.APP_URL }}" ]; then
            echo "Error: APP_URL secret is not set."
            exit 1
          fi
          curl -f -s -X GET "${{ secrets.APP_URL }}/api/cron"
          echo "Ping successful!"
